<section id="visitors" class="hydra-visitors" data-theme="__THEME__" data-visitor-host="__LIVE_HOST__" data-visitor-path="__LIVE_PATH__" aria-labelledby="visitor-title">
  <div class="__CONTAINER_CLASS__">
    <h2 id="visitor-title" class="hydra-visitors-title">Visitors around the world</h2>
    <p class="hydra-visitors-intro">Explore where HYDRA's readers come from.</p>
    <div class="hydra-visitors-grid">
      <figure class="hydra-visitors-card hydra-visitors-map">
        <figcaption class="hydra-visitors-card-title">Global visitor map</figcaption>
        <a class="hydra-visitors-image-link" href="__STATS_URL__" target="_blank" rel="noopener noreferrer" aria-label="Open HYDRA's global visitor statistics">
          <img class="hydra-visitors-image" data-visitor-src="__MAP_URL__" alt="World map with flags marking the countries of HYDRA visitors" decoding="async" fetchpriority="low" referrerpolicy="no-referrer" hidden>
        </a>
        <p class="hydra-visitors-status" role="status">Loading visitor map…</p>
      </figure>
      <figure class="hydra-visitors-card hydra-visitors-countries">
        <figcaption class="hydra-visitors-card-title">Visits by country</figcaption>
        <a class="hydra-visitors-image-link" href="__STATS_URL__" target="_blank" rel="noopener noreferrer" aria-label="Open the complete country breakdown and visitor totals">
          <img class="hydra-visitors-image" data-visitor-src="__COUNTRIES_URL__" alt="The 20 most active visitor countries, with a visit count beside each flag" decoding="async" fetchpriority="low" referrerpolicy="no-referrer" hidden>
        </a>
        <p class="hydra-visitors-status" role="status">Loading country counts…</p>
        <p class="hydra-visitors-card-note">The 20 most active countries. Open the full report for every country and visitor totals.</p>
      </figure>
    </div>
    <div class="hydra-visitors-bottom">
      <p class="hydra-visitors-note">Shared across the project page and training logs. A visitor is counted once per 24 hours; updates may take a few minutes.</p>
      <a class="hydra-visitors-report" href="__STATS_URL__" target="_blank" rel="noopener noreferrer">View all countries &amp; visitor history <span aria-hidden="true">↗</span></a>
    </div>
    <p class="hydra-visitors-credit">Country estimates and counts provided by <a href="https://www.flagcounter.com/" target="_blank" rel="noopener noreferrer">Flag Counter</a>.</p>
    <noscript><p class="hydra-visitors-noscript">Open the <a href="__STATS_URL__" target="_blank" rel="noopener noreferrer">visitor report</a> to view the world map, visitor totals, and country counts.</p></noscript>
  </div>
</section>
