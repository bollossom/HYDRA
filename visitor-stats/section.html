<section id="visitors" class="hydra-visitors" data-theme="__THEME__" data-visitor-host="__LIVE_HOST__" data-visitor-path="__LIVE_PATH__" aria-labelledby="visitor-title">
  <div class="__CONTAINER_CLASS__">
    <figure class="hydra-visitors-card">
      <figcaption><h2 id="visitor-title" class="hydra-visitors-title">Total page views</h2></figcaption>
      <p class="hydra-visitors-note">Shared across the project page and training logs. Counts page views, not unique visitors.</p>
      <a class="hydra-visitors-image-link" href="__STATS_URL__" target="_blank" rel="noopener noreferrer" aria-label="Open HYDRA's page-view statistics">
        <img class="hydra-visitors-image" data-visitor-src="__TOTAL_URL__" alt="HYDRA's total page views, provided by Flag Counter" decoding="async" fetchpriority="low" referrerpolicy="no-referrer" hidden>
      </a>
      <p class="hydra-visitors-status" role="status">Loading total page views…</p>
      <a class="hydra-visitors-report" href="__STATS_URL__" target="_blank" rel="noopener noreferrer">View page-view history <span aria-hidden="true">↗</span></a>
      <p class="hydra-visitors-credit">Counts provided by <a href="https://www.flagcounter.com/" target="_blank" rel="noopener noreferrer">Flag Counter</a>.</p>
      <noscript><p class="hydra-visitors-noscript">Open the <a href="__STATS_URL__" target="_blank" rel="noopener noreferrer">page-view report</a> to view the total.</p></noscript>
    </figure>
  </div>
</section>
